<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 360° Liquid Glass Specular & Depth Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242E3B"/>
      <stop offset="100%" stop-color="#141A22"/>
    </linearGradient>
    
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E05436"/>
      <stop offset="100%" stop-color="#B33920"/>
    </linearGradient>
    
    <linearGradient id="specularBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.85)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.4)"/>
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Strict 2px-style rounded squircle base (scaled to 512) -->
  <rect x="24" y="24" width="464" height="464" rx="54" fill="url(#bgGrad)" filter="url(#subtleGlow)"/>
  <rect x="24" y="24" width="464" height="464" rx="54" fill="none" stroke="url(#specularBorder)" stroke-width="8"/>

  <!-- Atelier Infinity / Dual-Loop Haute Emblem -->
  <g transform="translate(256, 195)">
    <!-- Left Loop (Ecru / Titanium) -->
    <path d="M-55,-40 C-105,-40 -140,-5 -140,40 C-140,85 -105,120 -55,120 C-10,120 25,85 25,40 C25,-5 -10,-40 -55,-40 Z" fill="none" stroke="#F8F7F4" stroke-width="26" stroke-linecap="round"/>
    
    <!-- Right Loop (Terracotta Signature) -->
    <path d="M55,-40 C10,-40 -25,-5 -25,40 C-25,85 10,120 55,120 C105,120 140,85 140,40 C140,-5 105,-40 55,-40 Z" fill="none" stroke="url(#terracottaGrad)" stroke-width="26" stroke-linecap="round"/>

    <!-- Specular Center Dots -->
    <circle cx="-55" cy="40" r="14" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="55" cy="40" r="14" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- Wordmark 'OUTFIT' underneath -->
  <text x="256" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Outfit', sans-serif" font-size="46" font-weight="900" letter-spacing="8" text-anchor="middle" fill="#F8F7F4">
    OUT<tspan fill="#C84428">FIT</tspan>
  </text>
</svg>
